name: Feature request / Sugerir melhoria
description: Describe a use case or a contribution idea. English or Portuguese welcome.
title: "[FEAT] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / Problema ou caso de uso
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Comportamento proposto
      description: Explain the outcome you want and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Would you like to help? / Quer contribuir?
      description: Optional. Share how you would like to help or what guidance you need.
