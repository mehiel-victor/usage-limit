name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK and Cairo bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 librsvg2-common gir1.2-ayatanaappindicator3-0.1
      - name: Check Python syntax and application imports
        run: |
          /usr/bin/python3 -m compileall -q ./*.py
          /usr/bin/python3 -c 'import usage_limit_widget'
          ./launch-usage-limit-panel --check
      - name: Run regression tests
        run: /usr/bin/python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Check shell syntax
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n launch-usage-limit-panel
          bash -n launch-usage-limit
